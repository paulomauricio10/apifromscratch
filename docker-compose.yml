services:
  mysql:
    image: mysql:8.4
    container_name: container_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-api_db}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "3306:3306"
    command: ["mysqld","--default-authentication-plugin=mysql_native_password"]
    volumes:
      # Mapeia diretório local (host) para o diretório de dados do MySQL no container
      - "C:\\sdk\\docker\\volumes\\vol-apifromscratch:/var/lib/mysql"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: container_api_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-api_db}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "8080:8080"
    # Em dev pode montar código para hot reload, omitido por simplicidade
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes: {}
